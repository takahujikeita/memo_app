<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモを検索 - 簡易メモ帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // カテゴリごとの色設定（index.htmlと共通）
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'meeting-bg': '#e0f2fe',
                        'meeting-text': '#0c4a6e',
                        'shopping-bg': '#dcfce7',
                        'shopping-text': '#166534',
                        'task-bg': '#fef9c3',
                        'task-text': '#854d0e',
                        'other-bg': '#f3f4f6',
                        'other-text': '#374151',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto max-w-4xl p-4 md:p-8">
        <header class="flex justify-between items-center my-8">
            <h1 class="text-4xl font-bold text-gray-800">メモを検索</h1>
            <a href="{{ url_for('index') }}" class="text-blue-600 hover:text-blue-800 hover:underline transition">
                &larr; メモ一覧に戻る
            </a>
        </header>

        <main>
            <!-- 検索条件入力セクション -->
            <section id="search-section" class="mb-8">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <form action="{{ url_for('search') }}" method="GET">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <div>
                                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">カテゴリ</label>
                                <select id="category" name="category" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                    <option value="" {% if not search_params.category %}selected{% endif %}>すべて</option>
                                    <option value="Meeting" {% if search_params.category == 'Meeting' %}selected{% endif %}>Meeting</option>
                                    <option value="Shopping" {% if search_params.category == 'Shopping' %}selected{% endif %}>Shopping</option>
                                    <option value="Task" {% if search_params.category == 'Task' %}selected{% endif %}>Task</option>
                                    <option value="Other" {% if search_params.category == 'Other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label for="keyword" class="block text-sm font-medium text-gray-700 mb-1">フリーワード</label>
                                <input type="text" id="keyword" name="keyword" value="{{ search_params.keyword or '' }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="キーワードを入力">
                            </div>
                            <div>
                                <label for="date" class="block text-sm font-medium text-gray-700 mb-1">記入日</label>
                                <input type="date" id="date" name="date" value="{{ search_params.date or '' }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>
                        <div class="text-right mt-4">
                             <button type="submit" class="bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                                検索
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 検索結果セクション -->
            <section id="list-section">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">検索結果</h2>
                <div class="space-y-4">
                    {% if searched %}
                        {% if notes %}
                            {% for note in notes %}
                            <div class="bg-white p-5 rounded-xl shadow-md">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="px-3 py-1 text-sm font-semibold rounded-full bg-{{note.category.lower()}}-bg text-{{note.category.lower()}}-text">{{ note.category }}</span>
                                    <span class="text-sm text-gray-500 flex-shrink-0 ml-4">{{ note.created_at[:16] }}</span>
                                </div>
                                <p class="text-gray-800 whitespace-pre-wrap">{{ note.content }}</p>
                            </div>
                            {% endfor %}
                        {% else %}
                            <div class="bg-white text-center py-12 px-5 rounded-xl shadow-md">
                                <p class="text-gray-500">条件に一致するメモは見つかりませんでした。</p>
                            </div>
                        {% endif %}
                    {% else %}
                        <div class="bg-white text-center py-12 px-5 rounded-xl shadow-md">
                            <p class="text-gray-500">検索条件を入力して、「検索」ボタンを押してください。</p>
                        </div>
                    {% endif %}

                </div>
            </section>
        </main>
    </div>

</body>
</html>
