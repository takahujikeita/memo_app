<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモアプリ</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>memo_app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind CSSのカスタマイズ（任意）
        // カテゴリごとに色を分けるための設定を追加
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'meeting-bg': '#e0f2fe',
                        'meeting-text': '#0c4a6e',
                        'shopping-bg': '#dcfce7',
                        'shopping-text': '#166534',
                        'task-bg': '#fef9c3',
                        'task-text': '#854d0e',
                        'other-bg': '#f3f4f6',
                        'other-text': '#374151',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto max-w-4xl p-4 md:p-8">
        <header class="text-center my-8">
            <h1 class="text-4xl font-bold text-gray-800">memo_app</h1>
        </header>

        <main>
            <!-- メモ入力セクション -->
            <section id="input-section" class="mb-8">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-2xl font-semibold text-gray-700 mb-4">新しいメモを保存</h2>
                    <form action="{{url_for('register')}}" method="POST">
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <div class="md:col-span-2">
                                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">メモ内容</tabel>
                                <textarea id="content" name="content" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="ここにメモを入力..."></textarea>
                            </div>
                        </div>
                        <div class="text-right">
                            <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                                保存
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- メモ検索セクション -->
            <section id="search-section" class="mb-8">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-2xl font-semibold text-gray-700 mb-4">メモを検索</h2>
                    <form action="/search" method="GET">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <div>
                                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">カテゴリ</label>
                                <select id="category" name="category" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                                    <option value="">すべて</option>
                                    <option value="Meeting">Meeting</option>
                                    <option value="Shopping">Shopping</option>
                                    <option value="Task">Task</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label for="keyword" class="block text-sm font-medium text-gray-700 mb-1">フリーワード</label>
                                <input type="text" id="keyword" name="keyword" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="キーワードを入力">
                            </div>
                            <div>
                                <label for="date" class="block text-sm font-medium text-gray-700 mb-1">記入日</label>
                                <input type="date" id="date" name="date" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                            </div>
                        </div>
                        <div class="text-right mt-4">
                             <button type="submit" class="bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                                検索
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- メモ一覧セクション --> 
            <section id="list-section">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">保存されたメモ一覧</h2>
                <div class="space-y-4">
                    {% for notes in notes %}
                    <div class="bg-white p-5 rounded-xl shadow-md">
                        <div class="flex justify-between items-center mb-2">
                            <span class="px-3 py-1 text-sm font-semibold rounded-full bg-meeting-bg text-meeting-text"> {{notes.category}} </span>
                            <span class="text-sm text-gray-500"> {{notes.created_at}} </span>
                        </div>
                        <p class="text-gray-800 whitespace-pre-wrap"> {{notes.content}} </p>
                    </div>
                    {% endfor %}
                     <div class="bg-white text-center py-12 px-5 rounded-xl shadow-md">
                        <p class="text-gray-500">表示するメモがありません。</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="text-center text-gray-500 py-8 mt-8">
            <p>&copy; 2025 Memo App. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
</body>
</html>
